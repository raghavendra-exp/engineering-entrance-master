name: Content Validation & Build Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check & Production Build
        run: npm run build

      - name: Verify Question Count Integrity
        run: |
          node -e '
            import("./src/data/questions/index.ts").then(m => {
              console.log("Total Questions in DB:", m.TOTAL_QUESTIONS_COUNT);
              if (m.TOTAL_QUESTIONS_COUNT < 1000) {
                console.error("Error: Questions count below minimum threshold of 1000!");
                process.exit(1);
              }
              console.log("Verified PYQs count:", m.VERIFIED_PYQS_COUNT);
              console.log("All question database sanity checks PASSED.");
            });
          '
